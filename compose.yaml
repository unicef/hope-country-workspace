x-common: &common
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: dist
  platform: linux/amd64
  env_file:
    - .env
  extra_hosts:
    - host.docker.internal:host-gateway
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    azurite:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  backend:
    <<: *common
    ports:
      - "${BACKEND_PORT}:8000"
    command: run
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck', timeout=5)"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    <<: *common
    command: worker
    depends_on:
      backend:
        condition: service_healthy

  celery-beat:
    <<: *common
    command: beat
    depends_on:
      backend:
        condition: service_healthy

  celery-flower:
    <<: *common
    ports:
      - "${FLOWER_PORT}:5555"
    command: flower
    depends_on:
      backend:
        condition: service_healthy

  stream_listener:
    <<: *common
    command: stream-listener
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      start_period: 5s
      start_interval: 1s
      interval: 5s
      timeout: 4s
      retries: 5

  redis:
    image: redis:7.2
    ports:
      - "${REDIS_PORT}:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 5s
      start_interval: 1s
      interval: 5s
      timeout: 4s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --skipApiVersionCheck
    ports:
      - "${AZURITE_PORT}:10000"
    volumes:
      - azurite_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      start_period: 5s
      start_interval: 1s
      interval: 5s
      timeout: 4s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.2-management
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    restart: always
    healthcheck:
      test:
        - CMD
        - gosu
        - rabbitmq
        - sh
        - -c
        - test -s /var/lib/rabbitmq/.erlang.cookie && exec rabbitmq-diagnostics -q ping
      start_period: 10s
      start_interval: 1s
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  default:
    name: cw-local

volumes:
  azurite_data:
  postgres_data:
