<div class="page-heading">
    {% if crumbs %}
        <nav class="page-breadcrumbs" aria-label="Breadcrumb">
            <ol>
                {% for crumb in crumbs %}
                    <li>
                        {{ crumb }}
                    </li>
                {% endfor %}
            </ol>
        </nav>
    {% endif %}
    <div class="page-title-row">
        <h2>
            {{ title }}
        </h2>
        {% if flags %}
            <span class="page-flags">{{ flags }}</span>
        {% endif %}
    </div>
</div>
