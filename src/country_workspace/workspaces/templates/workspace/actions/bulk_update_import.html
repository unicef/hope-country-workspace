{% extends "workspace/actions/base.html" %}
{% load i18n %}
{% block action-content %}
    <div>
        <form method="post" id="bulk-update-form" enctype="multipart/form-data">
            {% csrf_token %}
            <table>
                {{ form.as_table }}
            </table>
            <div class="submit-row">
                <input type="submit" value="{% translate 'Import' %}" class="default" name="_import" />
            </div>
        </form>
    </div>
{% endblock action-content %}
