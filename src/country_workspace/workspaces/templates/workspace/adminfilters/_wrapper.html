{% load i18n static %}
{# Always open, with HOPE's field label in place of the collapsible "By ..." summary. #}
<div {% include "adminfilters/_attrs.html" with spec=spec %}>
    {% block title %}
        <span class="filter-label">{{ spec.get_title }}</span>
    {% endblock title %}
    <div class="filter-content">
        {% block content %}
        {% endblock %}
        {% block script %}
        {% endblock %}
    </div>
</div>
