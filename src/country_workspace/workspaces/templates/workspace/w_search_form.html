{% load i18n static %}
{% if cl.search_fields %}
    <div class="filter-field filter-search">
        <label for="searchbar" class="filter-label">{% translate "Search" %}</label>
        <form id="changelist-search" method="get" role="search">
            <div class="search-input">
                <img src="{% static "admin/img/search.svg" %}" alt="" aria-hidden="true" />
                <input type="text"
                       name="{{ search_var }}"
                       value="{{ cl.query }}"
                       id="searchbar"
                       {% if cl.search_help_text %} aria-describedby="searchbar_helptext"{% endif %} />
            </div>
            {% for pair in cl.params.items %}
                {% if pair.0 != search_var %}
                    <input type="hidden" name="{{ pair.0 }}" value="{{ pair.1 }}" />
                {% endif %}
            {% endfor %}
            {% if cl.search_help_text %}
                <div class="helptext" id="searchbar_helptext">
                    {{ cl.search_help_text }}
                </div>
            {% endif %}
        </form>
    </div>
{% endif %}
