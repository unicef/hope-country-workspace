[pytest]
norecursedirs = data .tox _plugin_template .idea  node_modules ~*
django_find_project = false
DJANGO_SETTINGS_MODULE = country_workspace.config.settings
log_format = %(asctime)s %(levelname)s %(message)s
log_level = CRITICAL
pythonpath = tests/extras src/
log_date_format = %Y-%m-%d %H:%M:%S
;reruns = 3
;reruns_delay = 2
addopts =
        --cov country_workspace
        --cov-report=html
        --cov-config=./tests/.coveragerc
        --create-db
        --maxfail=20
        --tb=short
        --capture=no
        --echo-version django
        --echo-env PYTHONPATH
        --headless


markers =
    integration
    selenium
    api
    admin
    skip_models
    skip_buttons
    select_buttons
    smoke
    security
    skip_models


filterwarnings =
    ignore::DeprecationWarning
    ignore::RuntimeWarning
