[circus]
# Keep off 5555 — that is Flower's default port
endpoint = tcp://127.0.0.1:17955
pubsub_endpoint = tcp://127.0.0.1:17956
check_delay = 5
httpd = False

# --- web (uwsgi) ---
# Wrapper builds --static-map safely (Circus env substitution breaks on '=' in values)
[watcher:web]
cmd = /usr/local/bin/run-uwsgi.sh
autostart = $(circus.env.WEB_ENABLE)
numprocesses = 1
copy_env = True
stop_signal = QUIT
graceful_timeout = 30
stdout_stream.class = StdoutStream
stderr_stream.class = StdoutStream

# --- celery worker ---
[watcher:celery]
cmd = gosu hope:unicef celery -A country_workspace.config.celery worker --statedb worker -E --loglevel=DEBUG
autostart = $(circus.env.CELERY_ENABLE)
numprocesses = 1
copy_env = True
stdout_stream.class = StdoutStream
stderr_stream.class = StdoutStream

# --- celery beat ---
[watcher:beat]
cmd = gosu hope:unicef celery -A country_workspace.config.celery beat --loglevel=DEBUG --scheduler django_celery_beat.schedulers:DatabaseScheduler
autostart = $(circus.env.BEAT_ENABLE)
numprocesses = 1
singleton = True
copy_env = True
stdout_stream.class = StdoutStream
stderr_stream.class = StdoutStream

# --- flower ---
[watcher:flower]
cmd = gosu hope:unicef celery -A country_workspace.config.celery flower --address=0.0.0.0 --port=5555
autostart = $(circus.env.FLOWER_ENABLE)
numprocesses = 1
copy_env = True
stdout_stream.class = StdoutStream
stderr_stream.class = StdoutStream

[env:flower]
DATABASE_URL = sqlite://:memory:

# --- streaming: default (no STREAM_N_* overrides) ---
[watcher:stream_default]
cmd = gosu hope:unicef stream listen
autostart = $(circus.env.STREAM_DEFAULT_ENABLE)
numprocesses = 1
copy_env = True
stdout_stream.class = StdoutStream
stderr_stream.class = StdoutStream

# --- streaming slots 1-5 (env-driven) ---
# STREAM_N_QUEUE_ARGS is built by the entrypoint as: -q alias1 -q alias2 ...
[watcher:stream_1]
cmd = gosu hope:unicef stream listen $(circus.env.STREAM_1_QUEUE_ARGS) -cb $(circus.env.STREAM_1_CALLBACK)
autostart = $(circus.env.STREAM_1_ENABLE)
numprocesses = $(circus.env.STREAM_1_WORKERS)
copy_env = True
stdout_stream.class = StdoutStream
stderr_stream.class = StdoutStream

[watcher:stream_2]
cmd = gosu hope:unicef stream listen $(circus.env.STREAM_2_QUEUE_ARGS) -cb $(circus.env.STREAM_2_CALLBACK)
autostart = $(circus.env.STREAM_2_ENABLE)
numprocesses = $(circus.env.STREAM_2_WORKERS)
copy_env = True
stdout_stream.class = StdoutStream
stderr_stream.class = StdoutStream

[watcher:stream_3]
