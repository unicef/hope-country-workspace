stderr_stream.class = StdoutStream

[watcher:stream_4]
cmd = gosu hope:unicef stream listen $(circus.env.STREAM_4_QUEUE_ARGS) -cb $(circus.env.STREAM_4_CALLBACK)
autostart = $(circus.env.STREAM_4_ENABLE)
